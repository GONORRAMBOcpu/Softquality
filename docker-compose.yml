services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: softquality_user
      POSTGRES_PASSWORD: softquality_pass
      POSTGRES_DB: softquality_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softquality_user -d softquality_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      RUNNING_IN_DOCKER: "true"
      DATABASE_URL: postgresql+psycopg2://softquality_user:softquality_pass@db:5432/softquality_db
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-src
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-src:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
